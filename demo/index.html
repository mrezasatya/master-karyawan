<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Master Karyawan Bukaka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar navigasi (desktop) / menu atas (HP) + area kerja, meniru aplikasi Laravel aslinya. */
:root {
  --brand: #006599; --brand-700: #00527c; --brand-50: #e8f3f9; --brand-100: #cfe5f1;
  --bg: #f5f8fa; --surface: #ffffff; --fg: #1c2a36; --muted: #5d6f7e; --line: #dde5eb; --soft: #eef3f6;
  --ok: #157a3c; --ok-bg: #dcf3e4; --warn: #8a5a00; --warn-bg: #fdf0cc; --orange: #9a4210; --orange-bg: #fde3cf;
  --bad: #b42318; --bad-bg: #fde4e1;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-700); }
.demo-bar { background: var(--brand); color: #fff; font-size: 12.5px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.demo-bar button { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.shell { display: flex; min-height: calc(100vh - 34px); }
aside { width: 236px; flex: none; background: var(--surface); border-right: 1px solid var(--line); }
aside .brand { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--line); }
aside .brand img { height: 22px; }
nav { padding: 10px; display: grid; gap: 2px; }
nav a { display: flex; align-items: center; min-height: 42px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
nav a:hover { background: var(--soft); }
nav a.active { background: var(--brand-50); color: var(--brand-700); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
header.top { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top .who { text-align: right; line-height: 1.2; }
header.top .who b { display: block; font-size: 13.5px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header.top .who span { font-size: 12px; color: var(--muted); }
.btn.menu-btn, .m-logo { display: none; }
.content { width: 100%; max-width: 1200px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) {
  aside { position: fixed; z-index: 40; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  aside.open { transform: none; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .btn.menu-btn { display: inline-flex; }
  .m-logo { display: block; height: 16px; }
  .scrim { position: fixed; inset: 0; background: rgba(15,30,45,.35); z-index: 30; }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } }

h1 { font-size: 22px; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 14.5px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.back { display: inline-block; margin-bottom: 6px; font-size: 13px; font-weight: 500; text-decoration: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.stack { display: grid; gap: 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .spanall { grid-column: 1 / -1; }
@media (max-width: 760px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } .span2, .span3 { grid-column: auto; } .tiles.g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn.primary { background: var(--brand); color: #fff; } .btn.primary:hover { background: var(--brand-700); }
.btn.secondary { background: var(--surface); border-color: #c5d1da; color: var(--fg); } .btn.secondary:hover { background: var(--soft); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; color: var(--brand-700); } .btn.ghost:hover { background: var(--brand-50); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }
.btn.red { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
label.l { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.req { color: var(--bad); }
.in { display: block; width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid #c5d1da; border-radius: 8px; background: var(--surface); }
textarea.in { min-height: 90px; resize: vertical; }
.in.err { border-color: var(--bad); }
.ferr { color: var(--bad); font-size: 12.5px; margin-top: 4px; }
.help { color: var(--muted); font-size: 12px; margin-top: 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; font-size: 15px; margin-bottom: 10px; padding: 0; }
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { background: #f3f7f9; text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; white-space: nowrap; }
.t td { padding: 9px 12px; border-top: 1px solid var(--soft); vertical-align: top; }
.t .r { text-align: right; } .nw { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px !important; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--soft); color: var(--muted); }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-orange { background: var(--orange-bg); color: var(--orange); } .b-bad { background: var(--bad-bg); color: var(--bad); }
.b-blue { background: var(--brand-100); color: var(--brand-700); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: inherit; display: block; }
.tile:hover { border-color: var(--brand); }
.tile small { color: var(--muted); font-size: 12px; } .tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.alert { border-radius: 10px; padding: 11px 14px; font-size: 13.5px; border: 1px solid; }
.a-ok { background: var(--ok-bg); border-color: #b4e2c4; color: var(--ok); }
.a-warn { background: var(--warn-bg); border-color: #f1d98a; color: var(--warn); }
.a-bad { background: var(--bad-bg); border-color: #f5b8b0; color: var(--bad); }
.a-info { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-700); }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 12px; min-height: 44px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tabs button.on { border-color: var(--brand); color: var(--brand-700); }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.item > div:first-child { min-width: 0; flex: 1 1 240px; }
.addbox { background: #f3f7f9; border-radius: 10px; padding: 14px; }
.meta { color: #8797a4; font-size: 12px; margin-top: 6px; }
.status { font-size: 13px; min-height: 20px; }
.s-ok { color: var(--ok); font-weight: 600; } .s-bad { color: var(--bad); font-weight: 600; } .s-busy { color: var(--brand-700); }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dl dt { color: var(--muted); font-size: 12.5px; } .dl dd { margin: 0; font-weight: 600; }
@media (max-width: 560px) { .dl { grid-template-columns: minmax(0, 1fr); } }
.auth { min-height: calc(100vh - 34px); display: flex; align-items: center; justify-content: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth .box { width: 100%; max-width: 380px; }
.auth .logo { text-align: center; margin-bottom: 26px; } .auth .logo img { height: 34px; } .auth .logo p { color: var(--muted); margin: 10px 0 0; font-size: 13px; }
.pw { position: relative; } .pw button { position: absolute; right: 4px; top: 4px; bottom: 4px; border: 0; background: none; color: var(--brand-700); font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 0 8px; }
.cred { font-family: var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; user-select: all; }
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(15,30,45,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; max-width: 440px; width: 100%; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #10324a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.photo-ph { width: 150px; aspect-ratio: 3/4; max-width: 100%; border: 2px dashed #c5d1da; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8797a4; font-size: 13px; text-align: center; }
.photo-img { width: 150px; aspect-ratio: 3/4; max-width: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
@media (max-width: 760px) { #prjgrid { grid-template-columns: minmax(0, 1fr) !important; } }
.cvgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .cvgrid { grid-template-columns: minmax(0, 1fr); } }
.ck li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13.5px; } .ck { list-style: none; padding: 0; margin: 0; }
.ck .y { color: var(--ok); } .ck .n { color: var(--bad); font-weight: 600; } .ck .w { color: var(--warn); }
.cv-stage { background: #d9e1e7; border-radius: 12px; padding: 16px; overflow: hidden; }
.cv-scale { transform-origin: top left; }
.chg del { color: var(--bad); } .chg ins { color: var(--ok); text-decoration: none; }

/* ===== Replika template CV Bukaka (ukuran dalam pt, letter 612pt) ===== */
.cv { width: 612pt; min-height: 792pt; background: #fff; color: #000; font: 10pt/13.5pt Helvetica, Arial, sans-serif; padding: 45pt 48pt 45pt 43pt; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
.cv table { border-collapse: collapse; } .cv td, .cv th { padding: 0; vertical-align: top; text-align: left; font-weight: normal; }
.cv .hdr { position: relative; height: 64.5pt; }
.cv .lg { position: absolute; left: 4pt; top: 5pt; width: 137pt; }
.cv .ttl { position: absolute; left: 154pt; top: 16pt; font: bold 12pt/14pt Helvetica, Arial, sans-serif; white-space: nowrap; }
.cv .ph { position: absolute; right: 0; top: 0; width: 81pt; height: 103pt; object-fit: cover; }
.cv h4 { font: bold 12pt/14pt Helvetica, Arial, sans-serif; margin: 0; }
.cv .hp { margin-left: 2pt; } .cv .pers { margin-top: 10.5pt; } .cv .pers td { height: 13.5pt; }
.cv .c1 { width: 11pt; } .cv .c2 { width: 124pt; } .cv .c3 { width: 13.6pt; }
.cv .he { margin: 21.2pt 0 0 1.4pt; } .cv .edu { margin: 4pt 0 0 1.3pt; } .cv .edu p { margin: 0; }
.cv .hx { margin: 8pt 0 0 .2pt; } .cv .exp { margin: 2pt 0 0 1.3pt; } .cv .exp td { line-height: 14.1pt; }
.cv .xs { width: 35.1pt; white-space: nowrap; } .cv .xd { width: 21.9pt; } .cv .xe { width: 46pt; padding-right: 3pt; white-space: nowrap; }
.cv .resp { font-size: 9pt; line-height: 11.5pt; padding-bottom: 3pt; white-space: pre-line; }
.cv .trn { width: 100%; margin: 3.8pt 0 0 -1.2pt; }
.cv .trn th { font-size: 13.5pt; line-height: 16pt; } .cv .trn th.sj { font: bold 12pt/16pt Helvetica, Arial, sans-serif; }
.cv .tn { width: 210pt; padding-left: 1.9pt; } .cv .ty { width: 47pt; text-align: center !important; } .cv .to { padding-left: 83pt; } .cv th.to { padding-left: 91.4pt; }
.cv .trn td { font-size: 13.5pt; line-height: 16pt; padding-top: 12.7pt; padding-bottom: 2.3pt; }
.cv .trn td.ty { padding-top: 15pt; padding-bottom: 0; } .cv .trn td.to { padding-top: 14.4pt; padding-bottom: .6pt; }
.cv .mu { color: #555; }
</style>
</head>

function reminder(e) {

  if (d < 0) return ['Lewat tanggal kontrak', 'b-bad']; if (d <= 30) return ['≤ 30 hari', 'b-orange']; if (d <= 60) return ['≤ 60 hari', 'b-warn']; if (d <= 90) return ['≤ 90 hari', 'b-blue'];
  return null;
}

/* ---------- field builder ---------- */
const errOf = n => S.errs[n];
const dv = (form, name, def = '') => (S.formKey === form && S.draft) ? (S.draft[name] ?? '') : def;
function field(name, label, value, o = {}) {
  const id = 'f-' + (o.key || '') + name; const e = errOf(name);
  const attrs = Object.entries(o.attrs || {}).map(([k, v]) => `${k}="${esc(v)}"`).join(' ');
  let input;
  if (o.options) {
    const opts = (o.placeholder === false ? '' : `<option value="">${esc(o.placeholder || '— Pilih —')}</option>`) +
      o.options.map(op => { const [v, t] = Array.isArray(op) ? op : [op, op]; return `<option value="${esc(v)}" ${String(v) === String(value ?? '') ? 'selected' : ''}>${esc(t)}</option>`; }).join('');
    input = `<select id="${id}" name="${name}" class="in ${e ? 'err' : ''}" ${attrs}>${opts}</select>`;
  } else if (o.type === 'textarea') {
    input = `<textarea id="${id}" name="${name}" class="in ${e ? 'err' : ''}" ${attrs}>${esc(value)}</textarea>`;
  } else {
    input = `<input id="${id}" name="${name}" type="${o.type || 'text'}" value="${esc(value)}" class="in ${e ? 'err' : ''}" ${attrs}>`;
  }
  return `<div class="${o.cls || ''}">${label ? `<label class="l" for="${id}">${esc(label)}${o.req ? ' <span class="req">*</span>' : ''}</label>` : ''}${input}${e ? `<div class="ferr">${esc(e)}</div>` : (o.help ? `<div class="help">${esc(o.help)}</div>` : '')}</div>`;
}
const formData = form => Object.fromEntries([...new FormData(form).entries()].map(([k, v]) => [k, typeof v === 'string' ? v.trim() : v]));

/* ---------- validasi ---------- */
function validateEmployee(d, current, fields) {
  const er = {}; const has = f => fields.includes(f);
  if (has('nik')) { if (!d.nik) er.nik = 'NIK wajib diisi.'; else if (S.employees.some(x => x.nik === d.nik && x !== current)) er.nik = 'NIK sudah terdaftar. Buka profil yang sudah ada untuk mengubah datanya.'; }
  if (has('nama') && !d.nama) er.nama = 'Nama wajib diisi.';
  if (has('jk') && !d.jk) er.jk = 'Jenis kelamin wajib diisi.';
  if (has('jobtitle') && !d.jobtitle) er.jobtitle = 'Job title wajib diisi.';
  if (has('tgl_masuk') && !d.tgl_masuk) er.tgl_masuk = 'Tanggal masuk wajib diisi.';
  if (has('tgl_lahir') && d.tgl_lahir && parseISO(d.tgl_lahir) > TODAY) er.tgl_lahir = 'Tanggal lahir tidak boleh di masa depan.';
  const masuk = has('tgl_masuk') ? d.tgl_masuk : current?.tgl_masuk;
  if (has('akhir_kontrak') && d.akhir_kontrak && masuk && d.akhir_kontrak < masuk) er.akhir_kontrak = 'Akhir kontrak tidak boleh sebelum tanggal masuk.';
  if (has('email') && d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) er.email = 'Email harus berupa alamat email yang valid.';
  if (has('hp') && d.hp) { d.hp = (d.hp.startsWith('+') ? '+' : '') + d.hp.replace(/\D/g, ''); if (!/^\+?\d{8,16}$/.test(d.hp)) er.hp = 'No. HP harus 8–16 digit angka (boleh diawali +).'; }
  ['ktp', 'kk'].forEach(f => { if (has(f) && d[f] && /^\d+$/.test(d[f]) && d[f].length !== 16) er[f] = `${f === 'ktp' ? 'No. KTP' : 'No. KK'} berupa angka harus 16 digit (saat ini ${d[f].length} digit).`; });
  return er;
}
function validateExperience(d) {
  const er = {}; const max = d.confirm_future ? nowYear + 5 : nowYear; const cur = !!d.current;
  if (!d.type) er.type = 'Jenis pengalaman wajib diisi.';
  if (!d.position) er.position = 'Jabatan wajib diisi.';
  if (!d.company) er.company = 'Nama perusahaan wajib diisi.';
  if (!d.sm || !d.sy) er.start = 'Bulan dan tahun mulai wajib diisi.';
  else if (d.sy < 1950 || d.sy > max) er.start = d.sy > nowYear ? 'Tahun mulai melewati tahun berjalan. Centang konfirmasi bila memang benar.' : 'Tahun mulai tidak valid.';
  if (!cur) {
    if (!d.em || !d.ey) er.end = 'Bulan dan tahun selesai wajib diisi, atau centang "Masih bekerja di sini".';
    else if (d.ey < 1950 || d.ey > max) er.end = d.ey > nowYear ? 'Tahun selesai melewati tahun berjalan. Centang konfirmasi bila memang benar.' : 'Tahun selesai tidak valid.';
    else if (!er.start && d.sy * 12 + d.sm > d.ey * 12 + d.em) er.end = 'Periode selesai tidak boleh sebelum periode mulai.';
  }
  if ((d.resp || '').length > 2000) er.resp = 'Uraian maksimal 2000 karakter.';
  return er;
}

/* ---------- CV ---------- */
function checklist(e) {
  const req = [['Name', !!e.nama], ['Sex', !!e.jk], ['Date of Birth', !!e.tgl_lahir], ['Citizen (kewarganegaraan)', !!e.kewarganegaraan], ['Position (job title)', !!e.jobtitle], ['Kontak: No. HP atau email', !!(e.hp || e.email)]];
  const warn = [['Foto', !!e.foto], ['Pendidikan', e.education.length > 0], ['Tahun lulus pada semua pendidikan', e.education.every(d => d.year)], ['Pengalaman kerja', e.experiences.length > 0], ['Bahasa', e.languages.length > 0], ['TRAINING', e.trainings.length > 0]];
  return { req, warn, ready: req.every(r => r[1]) };
}
function cvHTML(e) {
  const pers = [['Name', e.nama], ['Sex', e.jk === 'Laki-laki' ? 'Male' : e.jk === 'Perempuan' ? 'Female' : ''], ['Date of Birth', cvDate(e.tgl_lahir)], ['Citizen', e.kewarganegaraan], ['Position', e.jobtitle], ['Phone', e.hp], ['Email', e.email], ['Language', e.languages.join(', ')]];
  const edu = e.education.slice().sort((a, b) => (b.year || 0) - (a.year || 0));
  const title = x => x.type === 'Selama bekerja' ? `${x.position} di ${x.project || x.company}` : `${x.position} di ${x.company}${x.project ? ' — ' + x.project : ''}`;
  const trn = e.trainings.slice().sort((a, b) => (b.year || 0) - (a.year || 0));
  return `<div class="cv"><div class="hdr"><img class="lg" src="${LOGO}" alt="Bukaka"><div class="ttl">CURRICULUM VITAE OF PERSONNEL</div>${e.foto ? `<img class="ph" src="${e.foto}" alt="">` : ''}</div>
  <h4 class="hp">PERSONAL</h4><table class="pers">${pers.map(([l, v], i) => `<tr><td class="c1">${i + 1}.</td><td class="c2">${l}</td><td class="c3">:</td><td>${esc(v)}</td></tr>`).join('')}</table>
  <h4 class="he">EDUCATION BACKGROUND</h4><div class="edu">${edu.map(d => `<p>${[d.year, CV_LEVEL[d.level] || d.level, d.major, d.institution].filter(Boolean).map(esc).join(' - ')}</p>`).join('') || '<p class="mu">-</p>'}</div>
  <h4 class="hx">WORKING EXPERIENCES AND JOB RESPONSIBILITY</h4><table class="exp">${expSorted(e).map(x => `<tr><td class="xs">${my(x.sm, x.sy)}</td><td class="xd">s/d</td><td class="xe">${x.current ? 'Sekarang' : my(x.em, x.ey)}</td><td>${esc(title(x))}${x.resp ? `<div class="resp">${esc(x.resp)}</div>` : ''}</td></tr>`).join('') || '<tr><td class="mu">-</td></tr>'}</table>
  <table class="trn"><thead><tr><th class="tn sj">TRAINING</th><th class="ty">TAHUN</th><th class="to">PENYELENGGARA</th></tr></thead><tbody>${trn.map(t => `<tr><td class="tn">${esc(t.name)}</td><td class="ty">${esc(t.year || '')}</td><td class="to">${esc(t.org || '')}</td></tr>`).join('') || '<tr><td class="tn mu">-</td><td></td><td></td></tr>'}</tbody></table></div>`;
}
function viewCvList() {
  const q = S.cvq.toLowerCase(); const list = S.employees.filter(e => !q || e.nik.includes(q) || e.nama.toLowerCase().includes(q)).sort((a, b) => a.nama.localeCompare(b.nama)).slice(0, 25);
  return head('CV Generator', 'Cari karyawan → periksa kelengkapan → preview → unduh PDF.') + `<div style="margin-bottom:14px">${field('cvq', '', S.cvq, { type: 'search', attrs: { placeholder: 'Cari NIK atau nama…', 'aria-label': 'Cari karyawan', 'data-cvq': '1' } })}</div>

function viewCv() {

  <div class="card"><h3>Peringatan kelengkapan</h3><ul class="ck">${c.warn.map(([l, ok]) => `<li><span class="${ok ? 'y' : 'w'}">${ok ? '✔' : '!'}</span><span>${l}${ok ? '' : ' — belum ada'}</span></li>`).join('')}</ul><p class="help">Bagian yang kosong ditampilkan "-" pada CV.</p></div>
  <div class="card help" style="margin:0">KTP, BPJS, NPWP, KK, nama ibu, agama, golongan darah, tinggi/berat badan, status nikah, alamat, dan PTKP tidak pernah dicetak pada CV.</div></div>

function fitCv() {

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  const bar = `<div class="demo-bar"><span><b>MODE DEMO</b> · semua data fiktif dan hanya tersimpan sementara di browser ini. Muat ulang halaman = data kembali ke awal.</span>${S.user ? '<button data-act="resetdemo">Reset demo</button>' : ''}</div>`;
  let html;
  if (!S.user) html = viewLogin();
  else if (S.user.must) html = viewChangePw();
  else {
    const v = S.view; const hr = S.user.role === 'HR';
    const inner = !hr ? viewPortal() : v === 'dashboard' ? viewDashboard() : v === 'karyawan' ? viewEmployees() : v === 'baru' ? viewNewEmployee() : v === 'detail' ? viewDetail() : v === 'proyek' ? viewProjects() : v === 'import' ? viewImport() : v === 'cv' ? viewCvList() : v === 'cvdetail' ? viewCv() : v === 'akun' ? viewAccounts() : v === 'audit' ? viewAudit() : v === 'saya' ? viewPortal() : viewDashboard();
    html = viewShell(inner);
  }
  const modal = S.modal ? `<div class="modal-wrap" data-act="modalbg"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(S.modal.title)}</h2><p class="sub" style="font-size:13.5px">${S.modal.body}</p><div class="actions" style="justify-content:flex-end;margin-top:16px">${S.modal.onOk ? '<button class="btn secondary" data-act="modalno">Batal</button>' : ''}<button class="btn ${S.modal.danger ? 'danger' : 'primary'}" data-act="modalok">${esc(S.modal.label || 'OK')}</button></div></div></div>` : '';
  app.innerHTML = bar + html + modal + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  if (S.view === 'cvdetail') requestAnimationFrame(fitCv);
  if (S.focus) { const el = document.getElementById(S.focus); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_) { } } S.focus = null; }
}
function go(view, opts = {}) {
  S.view = view; S.menu = false; S.errs = {}; S.formKey = null; S.draft = null; S.flash = opts.flash || null; S.addExp = false; S.editExp = null; S.expState = null;
  if (opts.id) S.detailId = opts.id; if (opts.tab) S.tab = opts.tab;
  const h = view === 'detail' ? 'detail-' + S.detailId : view === 'cvdetail' ? 'cv-' + S.cvId : view;
  if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h);
  render(); window.scrollTo(0, 0);
}
const flash = (m, c = 'a-ok') => { S.flash = [m, c]; S.draft = null; S.formKey = null; S.errs = {}; };

/* ---------- interaksi ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-nav],[data-open],[data-cv],[data-act],[data-tabbtn]'); if (!t) return;
  if (t.matches('input[type=checkbox]')) return;
  if (t.dataset.nav) { ev.preventDefault(); if (t.dataset.filter) { S.f = { q: '', status: t.dataset.filter, project: '', kontrak: '', page: 1 }; } S.lastResult = t.dataset.nav === 'import' ? null : S.lastResult; go(t.dataset.nav); return; }
  if (t.dataset.open) { ev.preventDefault(); go('detail', { id: Number(t.dataset.open), tab: t.dataset.tab || 'identitas' }); return; }
  if (t.dataset.cv) { ev.preventDefault(); S.cvId = Number(t.dataset.cv); go('cvdetail'); return; }
  if (t.dataset.tabbtn) { S.tab = t.dataset.tabbtn; S.errs = {}; S.flash = null; S.addExp = false; S.editExp = null; S.expState = null; render(); return; }
  const a = t.dataset.act; const id = Number(t.dataset.id);
  const E = () => emp(S.detailId);
  switch (a) {
    case 'togglepw': { const i = document.getElementById('f-password'); i.type = i.type === 'password' ? 'text' : 'password'; t.textContent = i.type === 'password' ? 'Tampilkan' : 'Sembunyikan'; break; }
    case 'quick': doLogin(t.dataset.u, t.dataset.p); break;
    case 'logout': S.user = null; S.loginErr = null; S.view = 'dashboard'; history.replaceState(null, '', '#'); render(); break;
    case 'menu': S.menu = true; render(); break;
    case 'closemenu': S.menu = false; render(); break;
    case 'resetdemo': confirmBox('Reset demo?', 'Semua perubahan selama sesi ini dihapus dan data kembali ke kondisi awal.', 'Reset', () => location.reload()); break;
    case 'modalno': S.modal = null; render(); break;
    case 'modalbg': if (ev.target === t) { S.modal = null; render(); } break;
    case 'modalok': { const m = S.modal; S.modal = null; if (m.onOk) m.onOk(); else render(); break; }
    case 'page': S.f.page += Number(t.dataset.d); document.getElementById('emp-results').innerHTML = empRows(); break;
    case 'resetf': S.f = { q: '', status: '', project: '', kontrak: '', page: 1 }; render(); break;
    case 'newemp': go('baru'); break;
    case 'deact': { const e = emp(id); confirmBox('Nonaktifkan karyawan?', `${esc(e.nama)} dinonaktifkan. Data tetap tersimpan dan akun login ikut dinonaktifkan.`, 'Nonaktifkan', () => { e.status = 'Nonaktif'; const ac = accOf(e); if (ac) ac.status = 'Nonaktif'; log('employee', e.id, 'Deactivate', ['status_karyawan']); flash('Karyawan dinonaktifkan. Data tetap tersimpan; akun login ikut dinonaktifkan.'); render(); }, true); break; }
    case 'react': { const e = emp(id); e.status = 'Aktif'; log('employee', e.id, 'Update', ['status_karyawan']); flash('Karyawan diaktifkan kembali. Aktifkan akunnya di menu Akun Pengguna bila diperlukan.'); render(); break; }
    case 'endasg': { const as = E().assignments.find(x => x.id === id); as.status = 'Selesai'; as.end = as.end || iso(TODAY); log('employee_project', id, 'Update', ['assignment_status', 'assignment_end']); flash('Penugasan ditandai selesai. Riwayat tetap tersimpan.'); render(); break; }
    case 'reactasg': { const as = E().assignments.find(x => x.id === id); as.status = 'Aktif'; as.end = ''; log('employee_project', id, 'Update', ['assignment_status']); render(); break; }
    case 'deledu': { const e = E(); e.education = e.education.filter(x => x.id !== id); log('employee_education', id, 'Delete'); flash('Riwayat pendidikan dihapus.'); render(); break; }
    case 'dellang': { const e = E(); e.languages.splice(Number(t.dataset.i), 1); log('employee_language', e.id, 'Delete'); render(); break; }
    case 'deltrn': { const e = E(); e.trainings = e.trainings.filter(x => x.id !== id); log('training_certification', id, 'Delete'); flash('TRAINING dihapus.'); render(); break; }
    case 'delfoto': { const e = E(); e.foto = null; log('employee', e.id, 'Update', ['foto_path']); flash('Foto profil dihapus.'); render(); break; }
    case 'addexp': S.addExp = true; S.editExp = null; S.errs = {}; S.expState = null; render(); break;
    case 'canceladd': S.addExp = false; S.errs = {}; S.expState = null; render(); break;
    case 'editexp': S.editExp = S.editExp === id ? null : id; S.addExp = false; S.errs = {}; S.formKey = null; S.draft = null; S.expState = null; render(); break;
    case 'archexp': { const e = emp(Number(t.dataset.emp)); confirmBox('Arsipkan pengalaman?', 'Pengalaman tidak tampil lagi di CV. Di aplikasi asli data diarsipkan (soft delete) dan tercatat di audit log.', 'Arsipkan', () => { e.experiences = e.experiences.filter(x => x.id !== id); log('work_experience', id, 'SoftDelete'); flash('Pengalaman kerja diarsipkan.'); render(); }, true); break; }
    case 'prjtoggle': {
      const p = prj(id); const n = S.employees.reduce((s, e) => s + e.assignments.filter(x => x.projectId === id && x.status === 'Aktif').length, 0);
      const doIt = () => { p.status = p.status === 'Aktif' ? 'Nonaktif' : 'Aktif'; log('project', id, p.status === 'Nonaktif' ? 'Deactivate' : 'Update', ['status']); flash('Proyek diperbarui.'); render(); };
      if (p.status === 'Aktif' && n > 0) confirmBox('Proyek masih dipakai', `Proyek ini masih memiliki ${n} penugasan aktif. Tetap nonaktifkan? Riwayat penugasan tidak dihapus.`, 'Tetap nonaktifkan', doIt, true); else doIt();
      break;
    }
    case 'sample': S.importErr = null; S.preview = { file: 'contoh_master_data_karyawan.xlsx (3 baris file Anda + 4 baris contoh validasi)', analysis: analyzeRows(sampleRows(), 'masterKaryawan edited') }; render(); window.scrollTo(0, 0); break;
    case 'cancelimp': ev.preventDefault(); S.preview = null; flash('Import dibatalkan. Tidak ada data yang disimpan.'); render(); break;
    case 'closeresult': ev.preventDefault(); S.lastResult = null; S.flash = null; render(); break;
    case 'nodl': toast('Di aplikasi asli tombol ini mengunduh file. Halaman demo tidak dapat mengunduh file.'); break;
    case 'pdf': log('employee', S.cvId, 'GenerateCV'); toast('Di aplikasi asli tombol ini mengunduh PDF dengan tata letak yang sama seperti pratinjau.'); break;
    case 'bulk': { let n = 0; S.employees.filter(e => e.status === 'Aktif' && !accOf(e) && e.tgl_lahir).forEach(e => { S.accounts.push({ id: nextId(), username: e.nik, role: 'Karyawan', employeeId: e.id, pw: ddmmyy(e.tgl_lahir), must: true, status: 'Aktif', last: null }); n++; }); log('user_account', null, 'Create', [`massal ${n} akun`]); flash(`${n} akun karyawan dibuat. Password awal = tanggal lahir (DDMMYY), wajib diganti saat login pertama.`); render(); break; }
    case 'reset': { const ac = S.accounts.find(x => x.id === id); const e = ac.employeeId && emp(ac.employeeId); let msg; if (ac.role === 'Karyawan' && e && e.tgl_lahir) { ac.pw = ddmmyy(e.tgl_lahir); msg = `Password awal ${esc(ac.username)} = tanggal lahir (DDMMYY). Pengguna wajib menggantinya saat login.`; } else { ac.pw = Math.random().toString(36).slice(2, 12); msg = `Password sementara: <span class="cred">${esc(ac.pw)}</span><br>Hanya ditampilkan sekali. Sampaikan secara pribadi.`; } ac.must = true; log('user_account', ac.id, 'PasswordReset'); S.modal = { title: 'Password direset', body: msg, label: 'Selesai' }; render(); break; }
    case 'acctoggle': { const ac = S.accounts.find(x => x.id === id); ac.status = ac.status === 'Aktif' ? 'Nonaktif' : 'Aktif'; log('user_account', id, ac.status === 'Nonaktif' ? 'Deactivate' : 'Update', ['account_status']); flash(`Akun ${ac.username} sekarang ${ac.status}.`); render(); break; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('[data-act=weak]')) { S.weak = t.checked; return; }
  if (t.matches('[data-current]')) { const box = t.closest('form').querySelector('[data-endbox]'); box.hidden = t.checked; return; }
  if (t.matches('[data-filter-input]') && t.tagName === 'SELECT') { S.f[t.dataset.filterInput] = t.value; S.f.page = 1; document.getElementById('emp-results').innerHTML = empRows(); return; }
  if (t.matches('[data-photo]')) {
    const f = t.files[0]; const e = emp(Number(t.dataset.photo)); S.errs = {};
    if (!f) return; if (!['image/jpeg', 'image/png'].includes(f.type)) { S.errs.foto = 'Foto harus berformat JPG atau PNG.'; render(); return; }
    if (f.size > 2 * 1024 * 1024) { S.errs.foto = 'Ukuran foto maksimal 2 MB.'; render(); return; }
    const rd = new FileReader(); rd.onload = () => { e.foto = rd.result; log('employee', e.id, 'Update', ['foto_path']); flash('Foto profil disimpan.'); render(); }; rd.readAsDataURL(f); return;
  }
  if (t.matches('[data-xlsx]')) {
    const f = t.files[0]; if (!f) return; S.importErr = null;
    if (!window.XLSX) { S.importErr = 'Pustaka pembaca Excel gagal dimuat (periksa koneksi). Gunakan tombol "Coba dengan contoh file master lama".'; render(); return; }
    if (f.size > 10 * 1024 * 1024) { S.importErr = 'Ukuran file maksimal 10 MB.'; render(); return; }
    const rd = new FileReader(); rd.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' }); const name = wb.SheetNames.includes('Karyawan') ? 'Karyawan' : wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
        const an = analyzeRows(rows, name); if (an.fatal) { S.importErr = 'File tidak dapat diproses: ' + an.fatal; render(); return; }
        S.preview = { file: f.name, analysis: an }; render(); window.scrollTo(0, 0);
      } catch (err) { S.importErr = 'File tidak dapat dibaca sebagai Excel.'; render(); }
    }; rd.readAsArrayBuffer(f);
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('[data-filter-input]') && t.tagName === 'INPUT') { S.f.q = t.value; S.f.page = 1; document.getElementById('emp-results').innerHTML = empRows(); }
  if (t.matches('[data-cvq]')) { S.cvq = t.value; S.focus = t.id; render(); }
  if (t.matches('[data-accq]')) { S.accq = t.value; S.focus = t.id; render(); }
});
window.addEventListener('resize', fitCv);

function doLogin(u, p) {
  const ac = S.accounts.find(a => a.username === u.trim());
  S.fails = S.fails || {}; const key = u.trim().toLowerCase();
  if ((S.fails[key] || 0) >= 5) { S.loginErr = 'Terlalu banyak percobaan login. Coba lagi dalam 300 detik.'; render(); return; }
  if (!ac || ac.pw !== p || ac.status !== 'Aktif') {
    S.fails[key] = (S.fails[key] || 0) + 1; if (S.fails[key] === 5) log('security', null, 'Login-security-event', ['login_locked']);
    S.loginErr = 'Username atau password salah, atau akun tidak aktif.'; S.loginUser = u; render(); return;
  }
  S.fails[key] = 0; S.loginErr = null; S.user = ac; ac.last = new Date();
  S.view = ac.role === 'HR' ? 'dashboard' : 'saya'; S.flash = null; render();
}

document.addEventListener('submit', ev => {
  ev.preventDefault(); const form = ev.target; const kind = form.dataset.form; const d = formData(form); S.errs = {};
  if (kind !== 'saveexp') { S.formKey = kind; S.draft = d; }
  const E = () => emp(S.detailId);
  if (kind === 'login') { S.draft = null; S.formKey = null; if (!d.username || !d.password) { S.loginErr = 'Username dan password wajib diisi.'; S.loginUser = d.username; render(); return; } doLogin(d.username, d.password); return; }
  if (kind === 'changepw') {
    const u = S.user; const e = u.employeeId && emp(u.employeeId); const dob = e ? ddmmyy(e.tgl_lahir) : null;
    if (d.current !== u.pw) S.errs.current = 'Password lama salah.';
    else if (d.pw.length < 8 || !/[a-zA-Z]/.test(d.pw) || !/\d/.test(d.pw)) S.errs.pw = 'Password minimal 8 karakter dan mengandung huruf serta angka.';
    else if ((dob && d.pw.includes(dob)) || d.pw.includes(u.username)) S.errs.pw = 'Password baru tidak boleh memuat tanggal lahir atau NIK Anda.';
    else if (d.pw === d.current) S.errs.pw = 'Password baru harus berbeda dari password lama.';
    else if (d.pw !== d.pw2) S.errs.pw2 = 'Konfirmasi password tidak cocok.';
    if (Object.keys(S.errs).length) { render(); return; }
    u.pw = d.pw; u.must = false; log('user_account', u.id, 'PasswordChange'); S.view = u.role === 'HR' ? 'dashboard' : 'saya'; flash('Password berhasil diganti.'); render(); return;
  }
  if (kind === 'newemp') {
    const er = validateEmployee(d, null, [...F_ID, ...F_JOB]); if (Object.keys(er).length) { S.errs = er; S.draft = d; render(); window.scrollTo(0, 0); return; }
    const e = { id: nextId(), ...d, status: 'Aktif', foto: null, education: [], languages: [], trainings: [], experiences: [], assignments: [], created: new Date(), updated: new Date() };
    S.employees.push(e); log('employee', e.id, 'Create', Object.keys(d).filter(k => d[k])); S.draft = null;
    go('detail', { id: e.id, tab: 'pendidikan', flash: [`Profil ${e.nama} berhasil dibuat. Lanjutkan mengisi pendidikan, foto, dan TRAINING.`, 'a-ok'] }); return;
  }
  if (kind === 'saveid' || kind === 'savejob') {
    const e = E(); const fields = kind === 'saveid' ? F_ID : F_JOB; const er = validateEmployee(d, e, fields);
    if (Object.keys(er).length) { S.errs = er; render(); return; }
    const changed = fields.filter(f => String(e[f] ?? '') !== String(d[f] ?? '')); Object.assign(e, d); e.updated = new Date();
    if (changed.length) log('employee', e.id, 'Update', changed); flash(changed.length ? 'Perubahan tersimpan.' : 'Tidak ada perubahan.'); render(); return;
  }
  if (kind === 'addasg') {
    const e = E(); if (!d.projectId) { S.errs.projectId = 'Proyek wajib dipilih.'; render(); return; }
    if (d.end && d.start && d.end < d.start) { S.errs.end = 'Tanggal selesai tidak boleh sebelum tanggal mulai.'; render(); return; }
    if (e.assignments.some(x => x.projectId === Number(d.projectId) && (x.start || '') === (d.start || ''))) { S.errs.projectId = 'Penugasan ke proyek ini dengan tanggal mulai yang sama sudah ada.'; render(); return; }
    const as = { id: nextId(), projectId: Number(d.projectId), start: d.start, end: d.end, status: d.status }; e.assignments.push(as); log('employee_project', as.id, 'Create', ['project_id', 'assignment_status']); flash('Penugasan proyek ditambahkan.'); render(); return;
  }
  if (kind === 'addedu') {
    const e = E(); if (!d.level) S.errs.level = 'Jenjang wajib diisi.'; if (!d.institution) S.errs.institution = 'Institusi wajib diisi.';
    if (d.year && (Number(d.year) < 1950 || Number(d.year) > nowYear)) S.errs.year = `Tahun lulus harus antara 1950 dan ${nowYear}.`;
    if (Object.keys(S.errs).length) { render(); return; }
    const ed = { id: nextId(), level: d.level, major: d.major, institution: d.institution, year: d.year ? Number(d.year) : null }; e.education.push(ed); log('employee_education', ed.id, 'Create', ['level', 'institution']); flash('Riwayat pendidikan ditambahkan.'); render(); return;
  }
  if (kind === 'addlang') {
    const e = E(); const name = d.choice === 'Lainnya' ? d.other : d.choice;
    if (!d.choice) S.errs.choice = 'Pilih bahasa.'; else if (!name) S.errs.other = 'Tulis nama bahasa bila memilih Lainnya.'; else if (e.languages.some(l => l.toLowerCase() === name.toLowerCase())) S.errs.choice = `Bahasa ${name} sudah tercatat.`;
    if (Object.keys(S.errs).length) { render(); return; }
    e.languages.push(name); log('employee_language', e.id, 'Create', ['language_name']); flash(`Bahasa ${name} ditambahkan.`); render(); return;
  }
  if (kind === 'addtrn') {
    const e = E(); if (!d.type) S.errs.type = 'Jenis wajib diisi.'; if (!d.name) S.errs.name = 'Nama training wajib diisi.'; if (d.issue && d.expiry && d.expiry < d.issue) S.errs.expiry = 'Tanggal kedaluwarsa tidak boleh sebelum tanggal terbit.';
    if (Object.keys(S.errs).length) { render(); return; }
    const tr = { id: nextId(), type: d.type, name: d.name, year: d.year ? Number(d.year) : null, org: d.org, cert: d.cert, issue: d.issue, expiry: d.expiry }; e.trainings.push(tr); log('training_certification', tr.id, 'Create', ['item_type', 'item_name']); flash('TRAINING ditambahkan.'); render(); return;
  }
  if (kind === 'addprj') {
    if (!d.name) S.errs.name = 'Nama proyek wajib diisi.'; else if (S.projects.some(p => p.name.toLowerCase() === d.name.toLowerCase())) S.errs.name = 'Nama proyek sudah ada.';
    if (d.code && S.projects.some(p => (p.code || '').toLowerCase() === d.code.toLowerCase())) S.errs.code = 'Kode proyek sudah dipakai.';
    if (Object.keys(S.errs).length) { render(); return; }
    const p = { id: nextId(), code: d.code, name: d.name, status: 'Aktif' }; S.projects.push(p); log('project', p.id, 'Create', ['project_name']); flash(`Proyek ${p.name} ditambahkan.`); render(); return;
  }
  if (kind === 'addacc') {
    const e = S.employees.find(x => x.nik === d.nik);
    if (!d.nik) S.errs.nik = 'NIK wajib diisi.'; else if (!e) S.errs.nik = 'NIK tidak ditemukan pada data karyawan.'; else if (accOf(e)) S.errs.nik = 'Karyawan ini sudah memiliki akun.';
    if (Object.keys(S.errs).length) { render(); return; }
    let pw, msg; if (d.role === 'Karyawan' && e.tgl_lahir) { pw = ddmmyy(e.tgl_lahir); msg = 'Password awal = tanggal lahir (DDMMYY).'; } else { pw = Math.random().toString(36).slice(2, 12); msg = `Password sementara: <span class="cred">${pw}</span> — hanya ditampilkan sekali.`; }
    const ac = { id: nextId(), username: e.nik, role: d.role, employeeId: e.id, pw, must: true, status: 'Aktif', last: null }; S.accounts.push(ac); log('user_account', ac.id, 'Create', ['username', 'role']);
    S.draft = null; S.formKey = null; S.modal = { title: `Akun ${e.nik} dibuat`, body: msg + ' Pengguna wajib mengganti password saat login pertama.', label: 'Selesai' }; render(); return;
  }
  if (kind === 'processimp') { if (!d.ok) { S.errs.ok = 'Centang konfirmasi sebelum memproses import.'; render(); return; } applyImport(!!d.cp, !!d.ca); flash('Import selesai diproses.'); render(); window.scrollTo(0, 0); return; }
  if (kind === 'saveexp') saveExperience(form, d);
});

async function saveExperience(form, d) {
  const key = form.dataset.key; const e = emp(Number(form.dataset.emp)); const xid = form.dataset.id ? Number(form.dataset.id) : null;
  const v = { type: d.type, position: d.position, company: d.company, project: d.project, sm: Number(d.sm) || null, sy: Number(d.sy) || null, current: !!d.current, em: d.current ? null : (Number(d.em) || null), ey: d.current ? null : (Number(d.ey) || null), resp: d.resp, confirm_future: !!d.confirm_future };
  S.formKey = key; S.draft = v;
  const er = validateExperience(v);
  if (Object.keys(er).length) { S.errs = er; S.expState = { key, cls: 's-bad', msg: 'Belum tersimpan — periksa isian yang ditandai merah.' }; render(); return; }
  S.errs = {};
  for (let attempt = 1; attempt <= 4; attempt++) {
    S.expState = { key, busy: true, cls: 's-busy', msg: attempt === 1 ? 'Menyimpan…' : `Koneksi bermasalah, mencoba kembali (${attempt}/4)…` }; render();
    await new Promise(r => setTimeout(r, attempt === 1 ? 600 : 1300));
    const fail = S.weak && attempt <= 2;
    if (!fail) {
      const rec = { type: v.type, position: v.position, company: v.company, project: v.project, sm: v.sm, sy: v.sy, em: v.em, ey: v.ey, current: v.current, resp: v.resp, by: actor(), at: new Date() };
      if (xid) { Object.assign(e.experiences.find(x => x.id === xid), rec); log('work_experience', xid, 'Update', ['position', 'company_name', 'periode']); }
      else { const nx = { id: nextId(), ...rec }; e.experiences.push(nx); log('work_experience', nx.id, 'Create', ['experience_type', 'company_name', 'position', 'periode']); }
      S.addExp = false; S.editExp = null; S.formKey = null; S.draft = null; S.expState = null; flash(xid ? 'Perubahan pengalaman kerja tersimpan.' : 'Pengalaman kerja tersimpan.'); render(); window.scrollTo(0, 0); return;
    }
  }
}

function fromHash() {
  const h = location.hash.slice(1);
  if (!S.user || S.user.must || !h) return;
  let m;
  if ((m = h.match(/^detail-(\d+)$/)) && emp(Number(m[1]))) { S.detailId = Number(m[1]); S.view = 'detail'; }
  else if ((m = h.match(/^cv-(\d+)$/)) && emp(Number(m[1]))) { S.cvId = Number(m[1]); S.view = 'cvdetail'; }
  else if (['dashboard', 'karyawan', 'baru', 'proyek', 'import', 'cv', 'akun', 'audit', 'saya'].includes(h)) S.view = h;
  render();
}
window.addEventListener('hashchange', fromHash);
seedData(); render();
})();
